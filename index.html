<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas Monitoring System Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border-radius: 50px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.2em;
            color: #555;
            font-weight: 600;
        }

        .card-icon {
            font-size: 2em;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
        }

        .temp-icon { background: linear-gradient(135deg, #ff6b6b, #ff8e53); color: white; }
        .humidity-icon { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; }
        .gas-icon { background: linear-gradient(135deg, #fa709a, #fee140); color: white; }
        .status-icon { background: linear-gradient(135deg, #30cfd0, #330867); color: white; }

        .card-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            margin: 10px 0;
        }

        .card-unit {
            font-size: 0.5em;
            color: #888;
        }

        .card-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            margin-top: 10px;
        }

        .status-safe {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-warning {
            background: #fff3e0;
            color: #f57c00;
        }

        .status-danger {
            background: #ffebee;
            color: #c62828;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.5; }
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .chart-header {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .alert-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            max-width: 400px;
        }

        .alert {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: none;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .alert-danger {
            border-left: 5px solid #f44336;
        }

        .alert-warning {
            border-left: 5px solid #ff9800;
        }

        .alert-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
            color: #333;
        }

        .alert-message {
            color: #666;
        }

        .last-update {
            text-align: center;
            color: white;
            font-size: 0.9em;
            margin-top: 20px;
            opacity: 0.8;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
        }

        .refresh-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8em; }
            .dashboard { grid-template-columns: 1fr; }
            .alert-container { 
                left: 20px;
                right: 20px;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>
                    <i class="fas fa-shield-alt"></i>
                    Gas Monitoring System
                </h1>
                <div>
                    <span class="status-badge">
                        <i class="fas fa-circle"></i>
                        <span id="systemStatus">ONLINE</span>
                    </span>
                    <button class="refresh-btn" onclick="fetchData()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>
        </header>

        <div class="dashboard">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Temperature</div>
                    <div class="card-icon temp-icon">
                        <i class="fas fa-thermometer-half"></i>
                    </div>
                </div>
                <div class="card-value">
                    <span id="temperature">--</span>
                    <span class="card-unit">°C</span>
                </div>
                <div id="tempStatus" class="card-status status-safe">Normal</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title">Humidity</div>
                    <div class="card-icon humidity-icon">
                        <i class="fas fa-tint"></i>
                    </div>
                </div>
                <div class="card-value">
                    <span id="humidity">--</span>
                    <span class="card-unit">%</span>
                </div>
                <div id="humidityStatus" class="card-status status-safe">Normal</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title">Gas Level</div>
                    <div class="card-icon gas-icon">
                        <i class="fas fa-wind"></i>
                    </div>
                </div>
                <div class="card-value">
                    <span id="gasLevel">--</span>
                    <span class="card-unit">PPM</span>
                </div>
                <div id="gasStatus" class="card-status status-safe">Safe</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title">Gas Detection</div>
                    <div class="card-icon status-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                </div>
                <div class="card-value">
                    <span id="gasDetection">--</span>
                </div>
                <div id="detectionStatus" class="card-status status-safe">No Gas</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-header">
                <i class="fas fa-chart-line"></i> Historical Data
            </div>
            <canvas id="dataChart" width="400" height="150"></canvas>
        </div>

        <div class="last-update">
            Last updated: <span id="lastUpdate">Never</span>
        </div>
    </div>

    <div class="alert-container" id="alertContainer"></div>

    <script>
        // ThingSpeak configuration
        const CHANNEL_ID = '3221984';
        const READ_API_KEY = 'AKT7J4I46XGYM7VY';
        const UPDATE_INTERVAL = 15000; // 15 seconds

        // Chart setup
        const ctx = document.getElementById('dataChart').getContext('2d');
        const dataChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Temperature (°C)',
                        data: [],
                        borderColor: '#ff6b6b',
                        backgroundColor: 'rgba(255, 107, 107, 0.1)',
                        tension: 0.4
                    },
                    {
                        label: 'Gas Level (PPM)',
                        data: [],
                        borderColor: '#fa709a',
                        backgroundColor: 'rgba(250, 112, 154, 0.1)',
                        tension: 0.4,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                    }
                },
                scales: {
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: {
                            display: true,
                            text: 'Temperature (°C)'
                        }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: {
                            display: true,
                            text: 'Gas Level (PPM)'
                        },
                        grid: {
                            drawOnChartArea: false,
                        },
                    },
                }
            }
        });

        function showAlert(type, title, message) {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                <div class="alert-title">${title}</div>
                <div class="alert-message">${message}</div>
            `;
            alertContainer.appendChild(alert);
            alert.style.display = 'block';

            setTimeout(() => {
                alert.style.animation = 'slideIn 0.5s ease reverse';
                setTimeout(() => {
                    alert.remove();
                }, 500);
            }, 5000);
        }

        function updateStatus(elementId, value, thresholds) {
            const element = document.getElementById(elementId);
            if (value >= thresholds.danger) {
                element.className = 'card-status status-danger';
                element.textContent = thresholds.dangerText;
                return 'danger';
            } else if (value >= thresholds.warning) {
                element.className = 'card-status status-warning';
                element.textContent = thresholds.warningText;
                return 'warning';
            } else {
                element.className = 'card-status status-safe';
                element.textContent = thresholds.safeText;
                return 'safe';
            }
        }

        async function fetchData() {
            try {
                const response = await fetch(
                    `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json?api_key=${READ_API_KEY}`
                );
                const data = await response.json();

                if (data) {
                    // Update values
                    const temperature = parseFloat(data.field3) || 0;
                    const humidity = parseFloat(data.field4) || 0;
                    const gasLevel = parseInt(data.field1) || 0;
                    const gasDetected = parseInt(data.field2) || 0;

                    document.getElementById('temperature').textContent = temperature.toFixed(1);
                    document.getElementById('humidity').textContent = humidity.toFixed(1);
                    document.getElementById('gasLevel').textContent = gasLevel;
                    document.getElementById('gasDetection').textContent = gasDetected ? 'DETECTED' : 'SAFE';

                    // Update statuses
                    const tempStatus = updateStatus('tempStatus', temperature, {
                        danger: 40,
                        warning: 35,
                        safeText: 'Normal',
                        warningText: 'High',
                        dangerText: 'Danger!'
                    });

                    const gasStatus = updateStatus('gasStatus', gasLevel, {
                        danger: 900,
                        warning: 600,
                        safeText: 'Safe',
                        warningText: 'Elevated',
                        dangerText: 'Danger!'
                    });

                    // Update gas detection status
                    const detectionStatus = document.getElementById('detectionStatus');
                    if (gasDetected) {
                        detectionStatus.className = 'card-status status-danger';
                        detectionStatus.textContent = 'GAS DETECTED!';
                        showAlert('danger', '⚠️ Gas Alert', 'Gas has been detected in the area!');
                    } else {
                        detectionStatus.className = 'card-status status-safe';
                        detectionStatus.textContent = 'No Gas';
                    }

                    // Check for alerts
                    if (tempStatus === 'danger') {
                        showAlert('danger', '🌡️ Temperature Alert', `Temperature is critically high: ${temperature.toFixed(1)}°C`);
                    } else if (tempStatus === 'warning') {
                        showAlert('warning', '⚠️ Temperature Warning', `Temperature is elevated: ${temperature.toFixed(1)}°C`);
                    }

                    if (gasStatus === 'danger') {
                        showAlert('danger', '💨 Gas Alert', `Gas level is critically high: ${gasLevel} PPM`);
                    }

                    // Update chart
                    const now = new Date();
                    const timeLabel = now.toLocaleTimeString();
                    
                    if (dataChart.data.labels.length > 10) {
                        dataChart.data.labels.shift();
                        dataChart.data.datasets[0].data.shift();
                        dataChart.data.datasets[1].data.shift();
                    }
                    
                    dataChart.data.labels.push(timeLabel);
                    dataChart.data.datasets[0].data.push(temperature);
                    dataChart.data.datasets[1].data.push(gasLevel);
                    dataChart.update();

                    // Update last update time
                    document.getElementById('lastUpdate').textContent = now.toLocaleString();
                    document.getElementById('systemStatus').textContent = 'ONLINE';
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('systemStatus').textContent = 'OFFLINE';
                showAlert('danger', 'Connection Error', 'Unable to fetch data from ThingSpeak');
            }
        }

        // Initial fetch
        fetchData();

        // Auto-refresh
        setInterval(fetchData, UPDATE_INTERVAL);
    </script>
</body>
</html>
